<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Ventas</title>
    <link rel="stylesheet" th:href="@{/Login.css}">
</head>
<body>

<div class="login-box">
    <h2>Sistema de Ventas</h2>
    <p>Inicia sesión para continuar</p>

    <form action="/login" method="post">
        <div class="campo">
            <label>Usuario</label>
            <input type="text" name="usuario" placeholder="Ingresa tu usuario" required />
        </div>
        <div class="campo">
            <label>Contraseña</label>
            <input type="password" name="clave" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-login">Iniciar sesión</button>
    </form>

    <div class="footer-link">
        ¿Quieres registrarte?

        <div class="switch">
            <a th:href="@{/registro}">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>
</div>

</body>
</html>
