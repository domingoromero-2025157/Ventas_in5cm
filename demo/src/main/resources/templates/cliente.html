<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/crud.css}">
</head>
<body>

<nav>
    <span class="brand">Sistema de Ventas</span>
    <a href="/home" class="back">← Volver al inicio</a>
</nav>

<div class="contenido">
    <h2>Clientes</h2>

    <div class="buscador">
        <input type="text" id="buscar" placeholder="Buscar cliente..." onkeyup="buscar()">
        <button onclick="buscar()">Buscar</button>
    </div>

    <button class="btn-agregar" onclick="abrirModal()">+ Agregar cliente</button>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody id="tabla">
        <tr>
            <td>1</td><td>Juan Pérez</td><td>juan@email.com</td><td>5551-0001</td>
            <td>
                <button class="btn-editar" onclick="abrirModal()">Editar</button>
                <button class="btn-eliminar">Eliminar</button>
            </td>
        </tr>
        <tr>
            <td>2</td><td>María López</td><td>maria@email.com</td><td>5551-0002</td>
            <td>
                <button class="btn-editar" onclick="abrirModal()">Editar</button>
                <button class="btn-eliminar">Eliminar</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="modal-fondo" id="modal">
    <div class="modal">
        <h3>Agregar / Editar Cliente</h3>
        <div class="campo"><label>Nombre</label><input type="text" placeholder="Nombre completo"></div>
        <div class="campo"><label>Email</label><input type="email" placeholder="correo@email.com"></div>
        <div class="campo"><label>Teléfono</label><input type="text" placeholder="5551-0000"></div>
        <div class="modal-botones">
            <button class="btn-guardar">Guardar</button>
            <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>
</div>

<script>
    function abrirModal() { document.getElementById('modal').classList.add('activo'); }
    function cerrarModal() { document.getElementById('modal').classList.remove('activo'); }
    function buscar() {
        const texto = document.getElementById('buscar').value.toLowerCase();
        document.querySelectorAll('#tabla tr').forEach(fila => {
            fila.style.display = fila.textContent.toLowerCase().includes(texto) ? '' : 'none';
        });
    }
</script>
</body>
</html>
