<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>

    <link rel="stylesheet" th:href="@{/crud.css}">
</head>
<body>

<!-- NAVBAR -->
<nav>
    <span class="brand">Sistema de Ventas</span>
    <a href="/home" class="back">← Volver al inicio</a>
</nav>

<div class="contenido">

    <h2>Usuarios</h2>

    <!-- BOTÓN AGREGAR -->
    <button class="btn-agregar" onclick="abrirModal()">+ Agregar usuario</button>

    <!-- TABLA USUARIOS -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.id}"></td>
            <td th:text="${usuario.username}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.rol}"></td>
            <td th:text="${usuario.estado}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- MODAL -->
<div class="modal-fondo" id="modal">
    <div class="modal">
        <h3>Agregar / Editar Usuario</h3>

        <div class="campo">
            <label>Usuario</label>
            <input type="text" placeholder="Usuario">
        </div>

        <div class="campo">
            <label>Email</label>
            <input type="email" placeholder="Correo">
        </div>

        <div class="campo">
            <label>Rol</label>
            <input type="text" placeholder="USER / ADMIN">
        </div>

        <div class="campo">
            <label>Estado</label>
            <input type="number" placeholder="1 = activo / 0 = inactivo">
        </div>

        <div class="modal-botones">
            <button class="btn-guardar">Guardar</button>
            <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>
</div>

<script>
    function abrirModal() {
        document.getElementById('modal').classList.add('activo');
    }

    function cerrarModal() {
        document.getElementById('modal').classList.remove('activo');
    }
</script>

</body>
</html>
